name: VillagerPoiHalt
version: '1.2.0'
main: com.example.villagerpoihalt.VillagerPoiHaltPlugin
api-version: '1.21'
description: >-
  Stops villager brain behaviors (AcquirePoi/YieldJobSite/PoiCompetitorScan)
  from triggering synchronous POI loads on Folia region threads
  (workaround for PaperMC/Folia#292) by disabling villager AI in scoped areas.
  Trading via right-click still works with AI disabled.
author: VillagerPoiHalt
website: https://github.com/PaperMC/Folia/issues/292

# REQUIRED for Folia: without this flag Folia refuses to load the plugin.
folia-supported: true

# WorldGuard is optional; only used if "wg:" entries appear in disabled-regions.
softdepend:
  - WorldGuard

commands:
  vpoihalt:
    description: Manage villager AI halting (POI-load workaround).
    usage: |
      /vpoihalt status
      /vpoihalt toggle <world> <x> <z> <radius>
      /vpoihalt restore <world> <x> <z> <radius>
      /vpoihalt reload
    permission: vpoihalt.admin

permissions:
  vpoihalt.admin:
    description: Allows use of /vpoihalt.
    default: op
