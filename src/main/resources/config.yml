# ============================================================================
# VillagerPoiHalt configuration
#
# Why this plugin exists:
#   On Folia, villager brain behaviors (AcquirePoi, YieldJobSite,
#   PoiCompetitorScan) call PoiManager.getOrLoad(). If the POI index for a
#   needed chunk is not already cached in the current region, that call can
#   synchronously force-load POI data and stall the region's tick thread.
#   Confirmed open upstream bug: https://github.com/PaperMC/Folia/issues/292
#
# What this plugin does:
#   villager.setAI(false) fully stops Brain.tick() for that villager, so the
#   offending behaviors never run. Right-click trading STILL WORKS (the trade
#   GUI does not depend on AI ticking), but halted villagers will not move,
#   pathfind, work, restock-by-schedule*, or breed.
#
#   * Restocking is driven by brain schedule; keep that in mind for trading
#     halls (trades still function, restock behavior stops).
# ============================================================================

# If true, EVERY villager in EVERY world gets AI disabled on spawn/load.
# The scoping list below is ignored when this is true.
disable-ai-globally: true

# ============================================================================
# Halt method (added in v1.3.0)
#
# Both methods stop Brain.tick() — and therefore the POI lookups this plugin
# exists to prevent — but they differ in how "frozen" the villager looks:
#
#   aware  (recommended, default)
#     Uses Mob.setAware(false). The brain/goals are off, but PHYSICS STAY ON:
#     - villagers fall if there is no block below them (gravity works)
#     - they can be pushed by players, entities, pistons and water
#     - they take knockback when hit
#     They still won't walk, work on their own, breed or path.
#
#   no-ai
#     Uses setAI(false). Complete statue freeze: no gravity, no knockback,
#     cannot be pushed. (This was the only behavior before v1.3.0.)
#
# Changing this value and running /vpoihalt reload migrates already-halted
# villagers to the new method as they are re-checked (spawn/load/next sweep).
# ============================================================================
halt-method: aware

# Only used when disable-ai-globally is false.
# Villagers are halted only when they spawn/load INSIDE one of these areas.
# Two entry formats are supported:
#
#   1) World + radius (2D circle around x,z; y is ignored):
#        "radius:<world>:<x>:<z>:<radius>"
#      Example - a 64-block trading hall around 100,-250 in the overworld:
#        - "radius:world:100:-250:64"
#
#   2) WorldGuard region (requires the WorldGuard plugin to be installed):
#        "wg:<world>:<regionName>"
#      Example:
#        - "wg:world:trading_hall"
#
# Villagers OUTSIDE all listed areas are left completely untouched
# (free-roaming / quest villagers keep normal AI).
disabled-regions: []

# ============================================================================
# POI-scanning world spawners (added in v1.1.0)
#
# Halting villager AI does NOT stop three vanilla WORLD-LEVEL spawners that
# tick from ServerLevel.tickCustomSpawners() and run their own POI scans,
# hitting the same unsafe PoiManager.getOrLoad() sync-load path (Folia#292):
#
#   CatSpawner             - every 60s scans 48 blocks around a random player
#                            for bed POIs before spawning village cats.
#                            (Observed stalling a region thread for 135s!)
#   VillageSiege           - checks POI counts ("is this a village?") before
#                            starting zombie sieges.
#   WanderingTraderSpawner - searches for a bell (MEETING) POI within 48
#                            blocks when picking a trader spawn point.
#
# When enabled, this plugin removes the selected spawners from every world's
# spawner list (reflection; re-applied on world load and /vpoihalt reload).
# Setting an option back to false and running /vpoihalt reload restores that
# spawner without a restart.
#
# Side effects while stripped:
#   cat-spawner:      no naturally-spawning village/witch-hut cats
#                     (breeding & spawn eggs still work)
#   village-siege:    no zombie sieges
#   wandering-trader: no wandering trader spawns
#                     (alternative: /gamerule doTraderSpawning false)
# ============================================================================
strip-poi-spawners:
  enabled: true
  cat-spawner: true
  village-siege: true
  wandering-trader: true

# ============================================================================
# Managed employment (added in v1.2.0)
#
# With AI disabled, villagers can no longer take a job on their own — vanilla
# does that through the AcquirePoi brain behavior, which is the very POI lookup
# this plugin exists to prevent. Instead, the plugin runs its OWN job-site
# scan (only reading blocks in already-loaded chunks, on the correct region
# thread — never forcing a chunk/POI load) and assigns the matching profession
# + generates trades directly.
#
# Only unemployed ADULT villagers that this plugin manages (halted) are given
# jobs. Nitwits and already-employed villagers are left alone.
# ============================================================================
managed-employment:
  enabled: true
  # Blocks to search around each villager for a job-site block (1-8).
  # Keep this small; villagers normally claim job sites right next to them.
  search-radius: 4
  # How often to run the employment scan.
  check-interval-seconds: 10

# ============================================================================
# Managed restock (added in v1.2.0)
#
# With AI disabled, villagers no longer restock trades on their work schedule.
# This resets each trade's use counter (making sold-out trades available again)
# on a fixed cadence. Completed trades also award experience and advance the
# villager's level, replacing the brain-driven vanilla progression.
# Default: 4 times per 20 minutes = once every 5 minutes.
# ============================================================================
managed-restock:
  enabled: true
  times-per-cycle: 4
  cycle-minutes: 20

# ============================================================================
# Managed breeding (added in v1.4.0)
#
# With AI disabled, villagers can no longer breed on their own — vanilla does
# that through the BreedActivity brain behavior, which never runs when the
# brain is halted. This manager re-enables breeding by periodically checking:
#   1. Willingness — villager has food in inventory (bread, carrot, potato,
#      beetroot) or the vanilla willingness flag is set.
#   2. Bed availability — at least N bed blocks exist in nearby LOADED chunks.
#   3. Partner — another willing adult villager within 8 blocks.
#
# If all conditions are met, a baby villager is spawned at the midpoint and
# one food item is consumed from each parent. A 5-minute cooldown is enforced
# per villager (matching vanilla).
#
# Only halted villagers managed by this plugin are eligible.
# ============================================================================
managed-breeding:
  enabled: true
  # How far to scan for beds around each villager (1-16 blocks).
  search-radius: 8
  # How often to check breeding eligibility (in seconds).
  check-interval-seconds: 5
  # Minimum number of nearby bed blocks required for breeding (vanilla needs 2).
  min-beds: 2

# ============================================================================
# Managed movement (v1.6.0)
#
# Gives AI-disabled villagers limited natural-looking movement without
# restoring Brain.tick() or any POI lookup. Villagers take small steps toward
# nearby beds/workstations sometimes, and otherwise wander randomly nearby.
# All targets are selected from loaded blocks only.
# ============================================================================
managed-movement:
  enabled: true
  # Random movement radius around each villager (1-8 blocks).
  radius: 5
  # Seconds between movement steps.
  interval-seconds: 8
